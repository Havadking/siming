[project]
name = "devpanel"
version = "0.3.0"
description = "司命：本地项目控制台，一页管住机器上所有本地网页项目的启停、状态和日志"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
devpanel = "devpanel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devpanel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
