# devpanel 的唯一输入。改完保存，面板按 mtime 自动重载，不用重启。
panel:
  port: 9000            # 面板自己的端口
  open_browser: true    # serve 时顺手开浏览器

groups: [常用, 监控, AI, 浏览]

projects:
  - id: vsum
    name: 拾光笺
    cwd: E:/personal/projects/video-summarizer
    cmd: uv run --no-sync vsum ui --no-browser
    port: 7860
    autostart: true
    restart: on-failure
    env:
      PYTHONUTF8: "1"
    group: 常用

  - id: diting
    name: 谛听
    cwd: E:/personal/projects/guba-monitor
    cmd: python server.py --no-browser      # 系统 Python 3.9（winotify 装在那里），不是面板的 venv
    port: 17777                             # server.py 被占会自动 +1，那样面板会一直显示「端口没开」，先停掉占用者
    autostart: true
    restart: on-failure
    group: 监控

  - id: menshen
    name: 门神
    cwd: E:/personal/projects/miwifi
    cmd: npm start
    port: 8080
    autostart: true
    restart: on-failure
    env_file: .env                          # 只放 MIWIFI_PASSWORD=…，已在 miwifi/.gitignore 里，不要写进本文件
    group: 监控

  - id: dsh
    name: DeepSeek Harness
    cwd: E:/personal/projects/DeepSeek Harness
    cmd: npx -y @deepseek-ai/dsh web --no-open --port 3080   # -y：没缓存时别弹「要装吗」卡住；端口钉死，默认也是 3080
    port: 3080
    url_pattern: 'dsh web: (http\S+)'       # 地址带一次性 token，直接开 :3080 是 401，从日志里捞
    autostart: true
    restart: on-failure
    group: AI

  - id: rixing
    name: 日省
    cwd: E:/personal/projects/trade-journal
    cmd: uv run --no-sync rixing serve --no-browser
    port: 9100
    autostart: true
    restart: on-failure
    env:
      PYTHONUTF8: "1"
    group: 常用

  - id: jicui
    name: 集萃
    cwd: E:/personal/projects/telegram-export-viewer
    cmd: uv run --no-sync jicui serve --no-browser    # 启动时重扫 AyuGram 导出目录，一两秒
    port: 9200
    autostart: true
    restart: on-failure
    env:
      PYTHONUTF8: "1"
    group: 浏览

# 本地纯 HTML 单页小工具（免起后台服务，一键直达）
  - id: suishi
    name: 随拾
    cwd: E:/personal/projects/local-video-browser
    cmd: npm run dev                        # package.json 里 serve -l 8964，改端口两边要一起改
    port: 8964
    group: 浏览

  - id: suishi-share
    name: 随拾 · 局域网
    cwd: E:/personal/projects/local-video-browser
    cmd: npm run share                      # node server.mjs，共享目录 / 口令写在 local-video-browser/share.json（改完在这里重启）
    port: 8970                              # 绑 0.0.0.0，平板用 http://<本机IP>:8970 访问
    autostart: true
    restart: on-failure
    group: 浏览

tools:
  - id: index
    name: 短视频浏览
    file: E:\personal\projects\local-video-browser\index.html
